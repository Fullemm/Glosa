  function reviewHTML() {
    const now = Date.now();
    const items = dueItems();
    const nd = items.length;
    const pool = ZHC() ? ZHITEMS : JAITEMS;
    const name = (x) =>
      x.kind === "kana"
        ? x.kata
          ? "Katakana"
          : "Hiragana"
        : x.kind === "kanji"
        ? "Kanji"
        : x.kind === "hanzi"
        ? "Znaki"
        : x.k.indexOf("ph:t:") === 0
        ? "Słownictwo"
        : "Zwroty";
    const by = {};
    items.forEach((x) => {
      by[name(x)] = (by[name(x)] || 0) + 1;
    });
    let next = 0;
    pool.forEach((x) => {
      const d = due[x.k];
      if (d !== undefined && d > now && (!next || d < next)) next = d;
    });
    const mins = next ? Math.max(1, Math.round((next - now) / 6e4)) : 0;
    const when = !next
      ? ""
      : mins < 60
      ? `za około ${mins} min`
      : mins < 1440
      ? `za około ${Math.round(mins / 60)} h`
      : `za około ${Math.round(mins / 1440)} dni`;
    const seen = pool.filter((x) => due[x.k] !== undefined).length;

    return `<div class="card">
      ${
        nd
          ? `<div class="stats">${Object.keys(by)
              .map((k) => `<div class="stat-box"><b>${by[k]}</b><span>${k}</span></div>`)
              .join("")}</div>
             <button class="btn primary-cta" type="button" data-review>Zacznij (${nd})</button>
             ${when ? `<p class="small">Kolejne dojdą ${when}.</p>` : ""}`
          : `<p>${
              seen
                ? when
                  ? `Następna powtórka ${when}.`
                  : "Nic nie czeka."
                : "Jeszcze nic nie ćwiczyłeś. Zacznij w zakładce Nauka."
            }</p>`
      }
    </div>`;
  }

  /* ==========================================================================
   * ACTIVE RECALL & FSRS TRAINER (Wpisywanie z IME Romaji->Kana, Pisanie Sumi,
   * Uzupełnianie zdań Cloze, Audio Recall, oraz opcjonalny Wybór z 4)
   * ========================================================================== */
  const typingOn = () => store.get("typing", true);
  // jak często pytania z pisaniem odręcznym: 0 klawiatura, 1 mieszane, 2 głównie ręcznie, 3 tylko ręcznie
  const drawFreq = () => {
    const v = store.get("drawFreq", null);
    return v === null ? (store.get("qdraw", true) ? 1 : 0) : v;
  };
  const drawOn = () => drawFreq() > 0;
  const onlyOn = () => store.get("only", false);
  const autoOn = () =>
    store.get("auto:" + (T && T.deck ? T.deck.kind : "kana"), false);
  const scrTag = (x) =>
    x.kind === "kana"
      ? `<span class="scr${x.kata ? "" : " h"}">${
          x.kata ? "katakana" : "hiragana"
        }</span>`
      : "";

  function openTrainer(d, extraOpts) {
    T = Object.assign(
      {
        deck: d,
        sel: new Set(
          store.get(
            "sel:" + d.id,
            d.groups.slice(0, d.def || 1).map((g) => g.id)
          )
        ),
        mode: store.get("mode", "quiz"), // "quiz" (Active Recall) | "cards" (Fiszki)
        dir: store.get("dir:" + d.kind, 2), // 0: JP->PL/Reading, 1: PL/Reading->JP, 2: Mieszane
        audioOnly: false,
        ok: 0,
        n: 0,
        cur: null,
        run: false,
      },
      extraOpts || {}
    );
    nextQ();
  }

  const basePool = () => [
    ...new Set(
      T.deck.groups.filter((g) => T.sel.has(g.id)).flatMap((g) => g.items)
    ),
  ];
  const pool = () => {
    if (T.session) return T.sq.filter((e) => !e.done).map((e) => e.x);
    if (T.review) {
      const now = Date.now();
      return T.deck.all.filter((x) => (due[x.k] || 0) <= now);
    }
    const b = basePool();
    return onlyOn() ? b.filter((x) => !known(x.k)) : b;
  };
  const emptyMsg = () =>
    basePool().length && onlyOn()
      ? "W zaznaczonych grupach wszystko już umiesz. Wybierz inne albo wyłącz „Tylko nieopanowane” w ustawieniach."
      : "Zaznacz przynajmniej jedną grupę powyżej.";

  function pick(p, not) {
    let c = p.filter((x) => x !== not);
    if (!c.length) c = p;
    // Ważenie FSRS: wyższy priorytet dla niższej stabilności i dla elementów z błędami w Error Notebook
    const w = c.map((x) => {
      const errCnt =
        (E.CONFUSION.data.items &&
          E.CONFUSION.data.items[x.k] &&
          E.CONFUSION.data.items[x.k].count) ||
        0;
      return Math.pow(6 - need(x.k), 2) + errCnt * 6;
    });
    let r = Math.random() * w.reduce((a, b) => a + b, 0);
    let i = 0;
    for (; i < c.length - 1; i++) {
      r -= w[i];
      if (r <= 0) break;
    }
    return c[i];
  }

  function nextQ() {
    const p = pool();
    T.answered = null;
    T.revealed = false;
    T.pend = false;
    T.msg = "";
    clearTimeout(T.timer);
    if (!p.length) {
      T.cur = null;
      return;
    }
    T.intro = false;
    T.cur = T.session ? sessionPick() || pick(p, T.cur) : pick(p, T.cur);
    const x = T.cur;
    T.at = Date.now();
    if (T.intro) {
      T.qdraw = T.qtype = T.qcloze = T.qfree = false;
      T.qd = 0;
      return;
    }
    T.qd = T.dir === 2 ? (Math.random() < 0.5 ? 0 : 1) : T.dir;

    const same = p.filter((y) => y.kind === x.kind);
    const cand = (same.length >= 6 ? same : x.home).filter(
      (y) => y.a !== x.a && y.q !== x.q
    );
    const seen = new Set();
    const d = [];
    shuffle(cand).forEach((y) => {
      if (d.length < 3 && !seen.has(y.a)) {
        seen.add(y.a);
        d.push(y);
      }
    });
    T.opts = shuffle([x, ...d]);

    if (T.audioOnly) {
      T.qdraw = false;
      T.qtype = true;
      T.qcloze = false;
      setTimeout(() => say(x.say || x.q), 120);
      return;
    }

    T.qdraw =
      T.mode === "quiz" &&
      x.kind !== "phrase" &&
      drawOn() &&
      x.q.length === 1 &&
      (sc(x.k) >= 1 || drawFreq() >= 2) &&
      Math.random() <
        // gdy rozpoznawanie już umiesz, a pisanie jeszcze nie, pytaj prawie zawsze o pisanie — inaczej znak nigdy się nie zaliczy
        [0, sc(x.k) >= 3 && sw(x.k) < 4 ? 0.9 : T.review && sw(x.k) < sc(x.k) ? 0.75 : sw(x.k) < 4 ? 0.5 : 0.25, 0.85, 1][drawFreq()];

    T.qfree = !!(T.qdraw && window.RECOG_T && window.RECOG_T[x.q] && !ZHC());
    // zwroty: głównie z polskiego na japoński
    if (x.kind === "phrase" && T.dir === 2) T.qd = Math.random() < 0.75 ? 1 : 0;
    // znak chiński z polskiego: rysowanie albo pinyin
    if (x.kind === "hanzi" && T.qd === 1 && !T.qdraw) T.qd = 0;
    T.qtype = T.mode === "quiz" && !T.qdraw;

    // Ćwiczenie uzupełniania luk w zdaniu (Cloze) dla kanji z przykładowym zdaniem
    T.qcloze =
      T.qtype &&
      x.kind === "kanji" &&
      T.qd === 1 &&
      !!KSENT[x.q] &&
      plain(KSENT[x.q].m).includes(x.w);
  }

  /* ---------- Sprawdzanie wpisanych odpowiedzi (z obsługą Romaji->Kana) ---------- */
  const normA = (t) =>
    (t || "")
      .normalize("NFKC")
      .toLowerCase()
      .replace(/[\s。、．，.,!?！？・~〜'’"-]/g, "");

  function phraseVariants(m) {
    let out = [""];
    let last = 0;
    let mm;
    const re = new RegExp(RUBY.source, "g");
    while ((mm = re.exec(m))) {
      const pre = m.slice(last, mm.index);
      const k = mm[1];
      const r = mm[2];
      out = out.flatMap((o) => [o + pre + k, o + pre + r]).slice(0, 128);
      last = re.lastIndex;
    }
    return out.map((o) => normA(o + m.slice(last)));
  }

  const ROMA_ALT = {
    shi: ["si"],
    chi: ["ti"],
    tsu: ["tu"],
    fu: ["hu"],
    ji: ["zi", "di"],
    zu: ["du", "dzu"],
    wo: ["o"],
    n: ["nn"],
    sha: ["sya"],
    shu: ["syu"],
    sho: ["syo"],
    cha: ["tya", "cya"],
    chu: ["tyu", "cyu"],
    cho: ["tyo", "cyo"],
    ja: ["zya", "jya"],
    ju: ["zyu", "jyu"],
    jo: ["zyo", "jyo"],
  };
  /* Luźne porównanie polskiej odpowiedzi: bez ogonków, interpunkcji i dopisków w nawiasach, z tolerancją literówek. */
  const plNorm = (t) =>
    (t || "")
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/ł/g, "l")
      .replace(/[^a-z0-9 ]+/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  function lev(a, b) {
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++)
      for (let j = 1; j <= b.length; j++)
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }
  const STOP = new Set(["sie", "to", "jest", "a", "i", "w", "na", "do", "z", "o", "the", "an", "is", "are", "of", "it", "be"]);
  function polishMatch(raw, meaning) {
    const u = plNorm(raw);
    if (!u) return false;
    const variants = [meaning, meaning.replace(/\([^)]*\)/g, ""), ...meaning.split(/[,;/]|\bczyli\b/)]
      .map(plNorm)
      .filter((x) => x.length > 0);
    return variants.some((v) => {
      if (lev(u, v) <= Math.max(1, Math.floor(v.length * 0.2))) return true;
      const want = v.split(" ").filter((w) => !STOP.has(w));
      const got = u.split(" ");
      if (!want.length) return false;
      const hit = want.filter((w) => got.some((g) => lev(g, w) <= (w.length > 5 ? 2 : w.length > 3 ? 1 : 0))).length;
      return hit / want.length >= 0.75;
    });
  }
  const romaOK = (a, v) => v === a || (ROMA_ALT[a] || []).includes(v);

  function checkTyped(x, qd, raw) {
    if (x.kind === "hanzi") {
      if (!(raw || "").trim()) return { retry: "Najpierw wpisz odpowiedź." };
      if (raw.trim() === x.q)
        return { retry: "To sam znak. Wpisz jego pinyin z numerem tonu." };
      const want = pyNum(x.py);
      const got = pyNum(raw.replace(/[05]/g, ""));
      if (got === want) return "ok";
      if (got === want.replace(/[1-4]/, "") && /[1-4]/.test(want))
        return { retry: "Dobre głoski — dopisz numer tonu (1–4), np. „ma3”." };
      return "bad";
    }
    if (x.zh) {
      const cl = (t) => (t || "").replace(/[\s，。？！、,.?!'’]/g, "");
      if (!cl(raw)) return { retry: "Najpierw wpisz odpowiedź." };
      return cl(raw) === cl(plain(x.m)) || pyBare(raw) === pyBare(x.ro)
        ? "ok"
        : "bad";
    }

    const v = normA(raw);
    if (!v) return { retry: "Najpierw wpisz odpowiedź." };
    const vAsHira = toHira(E.IME.romajiToKana(v, "hiragana", false));
    const vAsKata = E.IME.romajiToKana(v, "katakana", false);

    if (T && T.audioOnly) {
      if (x.kind === "kana") {
        return romaOK(x.a, v) || vAsHira === toHira(x.q) ? "ok" : "bad";
      }
      if (x.kind === "kanji") {
        return vAsHira === x.wr || v === normA(x.w) || v.includes(normA(m1(x)))
          ? "ok"
          : "bad";
      }
      return phraseVariants(x.m).includes(v) ||
        vAsHira === toHira(normA(kanaOf(x.m)))
        ? "ok"
        : "bad";
    }

    const latin = /[a-ząćęłńóśźż]/i.test(v);
    const needJP = "Pisz japońską klawiaturą, nie literami.";
    if (x.kind === "kana") {
      if (qd === 0) {
        return romaOK(x.a, v) || vAsHira === toHira(x.q) ? "ok" : "bad";
      }
      if (latin) return { retry: needJP };
      if (v === x.q) return "ok";
      if (toHira(v) === toHira(x.q))
        return {
          retry: x.kata
            ? "Dobra sylaba, ale zapisana hiraganą — wpisz katakaną."
            : "Dobra sylaba, ale zapisana katakaną — wpisz hiraganą.",
        };
      return "bad";
    }

    if (x.kind === "kanji") {
      if (qd === 0) {
        if (toHira(v) === x.wr || vAsHira === x.wr) return "ok";
        if (v === normA(x.w))
          return { retry: "To zapis kanji — wpisz jego czytanie (hiraganą lub romaji)." };
        return "bad";
      }
      if (latin) return { retry: needJP };
      if (v === normA(x.w) || v === x.q) return "ok";
      if (toHira(v) === x.wr)
        return { retry: "Dobre czytanie. Teraz zamień je na kanji (klawiatura podpowie znak)." };
      return "bad";
    }

    // Zwroty i słownictwo
    if (qd === 0) return polishMatch(raw, x.a) ? "ok" : "bad";
    if (latin) return { retry: needJP };
    return phraseVariants(x.m).includes(v) || toHira(v) === toHira(normA(kanaOf(x.m)))
      ? "ok"
      : "bad";
  }

  function canon(x) {
    if (x.kind === "hanzi")
      return `<span class="jp" style="font-size:24px">${x.q}</span> = <b>${x.py}</b> (${x.a})<br>Ton ${TONES[toneOf(x.py)]}.<br><span class="jp">${x.w}</span> (${x.wp}) = ${x.wm}`;
    if (x.kind === "kana")
      return `<span class="jp" style="font-size:24px">${x.q}</span> = <b>${x.a}</b><br>${x.extra}`;
    if (x.kind === "kanji")
      return `<span class="jp" style="font-size:24px">${wordHTML(x)}</span> <i>${romaji(x.wr)}</i> = <b>${x.wm}</b><br>Znak <span class="jp">${x.q}</span> znaczy: ${x.a}`;
    return `<span class="jp" style="font-size:20px;line-height:2">${x.m.replace(RUBY, "<ruby>$1<rt>$2</rt></ruby>")}</span><br><i>${x.ro}</i> = <b>${x.a}</b>`;
  }

  const nextBtnHTML = () => `<div class="row"><button class="btn primary-cta" type="button" data-next>Dalej</button></div>`;
  function fsrsButtonsHTML(x, skill) {
    const ivls = E.FSRS.previewIntervals(x.k, skill || "recog");
    return `
      <div class="fsrs-grade-bar" aria-label="Oceń trudność przypomnienia (FSRS)">
        <button class="fsrs-btn g1" type="button" data-fsrs-rate="1">Powtórz<small>${ivls[1]}</small></button>
        <button class="fsrs-btn g2" type="button" data-fsrs-rate="2">Trudne<small>${ivls[2]}</small></button>
        <button class="fsrs-btn g3" type="button" data-fsrs-rate="3">Dobrze<small>${ivls[3]}</small></button>
        <button class="fsrs-btn g4" type="button" data-fsrs-rate="4">Łatwe<small>${ivls[4]}</small></button>
      </div>
    `;
  }

  function typedStage(x, pJP) {
    let pr = "";
    let ins = "";
    let imeScript = null; // null | "hiragana" | "katakana"

    if (T.audioOnly) {
      pr = `<div class="stack" style="align-items:center;gap:10px">
        <span class="lbl">Ze słuchu</span>
        <button class="btn" type="button" data-say="${esc(x.say || x.q)}">🔊 Odtwórz ponownie nagranie</button>
      </div>`;
      ins = "Wpisz usłyszane słowo (kaną lub romaji — przekonwertuję automatycznie):";
      imeScript = x.kata ? "katakana" : "hiragana";
    } else if (x.kind === "kana") {
      if (pJP) {
        pr = `<div class="prompt jp s1">${x.q}</div>`;
        ins = "Wpisz czytanie literami, np. „ka”";
      } else {
        pr = `${scrTag(x)}<div class="prompt s2">${x.a}</div>${
          x.amb ? `<p class="small">Chodzi o ${x.amb}.</p>` : ""
        }`;
        ins = `Napisz ten znak ${x.kata ? "katakaną" : "hiraganą"} na japońskiej klawiaturze`;
      }
    } else if (x.kind === "kanji") {
      if (pJP) {
        pr = `<div class="prompt jp s2">${x.w}</div><p class="small">Znaczenie słowa: <b>${x.wm}</b></p>`;
        ins = "Wpisz czytanie tego słowa (hiraganą albo literami)";
      } else if (T.qcloze && KSENT[x.q]) {
        const s = KSENT[x.q];
        const clozeSentence = plain(s.m).replace(x.w, " [ ___ ] ");
        pr = `<span class="lbl">Uzupełnij brakujące słowo w zdaniu</span>
          <div class="prompt jp" style="font-size:1.5rem">${esc(clozeSentence)}</div>
          <p class="small">${esc(s.pl)} · podpowiedź: <b>${esc(x.wm)}</b></p>`;
        ins = "Wpisz brakujące słowo z kanji, na japońskiej klawiaturze";
      } else {
        pr = `<div class="prompt">${x.wm}</div><p class="small">znak kanji: ${x.a}</p>`;
        ins = "Napisz to słowo z kanji, na japońskiej klawiaturze";
      }
    } else if (x.kind === "hanzi") {
      pr = `<div class="prompt jp s1">${x.q}</div>`;
      ins = "Wpisz pinyin z numerem tonu, np. „ma3”:";
    } else if (x.zh) {
      pr = `<div class="prompt">${x.a}</div>`;
      ins = "Wpisz zwrot po chińsku (znakami lub pinyin):";
    } else {
      if (pJP) {
        pr = `<div class="prompt jp">${ disp(x) }</div>`;
        ins = "Co to znaczy? Wpisz po polsku";
      } else {
        pr = `<div class="prompt">${x.a}</div>`;
        ins = "Napisz to po japońsku, na japońskiej klawiaturze";
      }
    }

    if (T.answered === null) {
      return (
        pr +
        `<form id="af" class="af">
          <label class="small" for="ans">${ins}</label>
          <input id="ans" class="ans" type="text" lang="${x.kind === "phrase" && pJP ? "pl" : x.kind === "hanzi" || (x.kind === "kana" && pJP) ? "en" : "ja"}" data-ime="${
            imeScript && E.prefs.romajiIME ? imeScript : ""
          }" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="${
          imeScript && E.prefs.romajiIME ? "Pisz romaji → " + (imeScript === "katakana" ? "カタカナ" : "ひらがな") : "Twoja odpowiedź…"
        }">
          <p id="amsg" class="small" role="status"></p>
          <div class="row">
            <button class="btn ghost" type="button" data-skip>Nie wiem</button>
            <button class="btn" type="submit">Sprawdź</button>
          </div>
        </form>`
      );
    }

    const ok = T.answered.ok;
    const val = T.answered.val;
    const skill = T.audioOnly ? "audio" : pJP ? "read" : "recog";
    return (
      pr +
      `<div class="fb">
        <span class="v ${ok ? "ok" : "bad"}">${
        ok ? "✓ Poprawna odpowiedź" : "✕ Błąd"
      }</span>
        ${!ok && val ? ` · Wpisano: <span class="jp">${esc(val)}</span>` : ""}
        <br>${canon(x)}
      </div>
      ${E.PITCH.renderSVG(x.w || x.q)}
      <div class="row">${sayBtn(x.say || x.q)}
        ${
          T.pend
            ? ib("data-override", "check", "Uznaj za poprawną", "okb")
            : ""
        }
      </div>
      ${nextBtnHTML()}`
    );
  }

  function chipsHTML() {
    const d = T.deck;
    const sets =
      d.kind === "kana"
        ? d.kata
          ? ["basic", "daku", "yoon", "ext", "conf"]
          : ["basic", "daku", "yoon", "conf"]
        : [null];
    return (
      `<div class="card"><h3>Zakres</h3>` +
      sets
        .map(
          (s) =>
            (s ? `<p class="small">${SETNAME[s]}</p>` : "") +
            `<div class="chips">` +
            d.groups
              .filter((g) => !s || g.set === s)
              .map(
                (g) =>
                  `<button class="chip${
                    g.set ? " jp" : ""
                  }" type="button" data-grp="${g.id}" aria-pressed="${T.sel.has(
                    g.id
                  )}">${g.label}</button>`
              )
              .join("") +
            `</div>`
        )
        .join("") +
      `<div class="chips"><button class="chip util wi" type="button" data-grp="*all">${IC.all}Wszystko</button><button class="chip util wi" type="button" data-grp="*none">${IC.x}Wyczyść</button></div></div>`
    );
  }

  const sizeCls = (t) => (t.length <= 2 ? "s1" : t.length <= 5 ? "s2" : "");
  const extraOf = (x) =>
    x.kind === "kanji"
      ? `Słowo: <span class="jp" style="font-size:20px">${wordHTML(
          x
        )}</span> <i>${romaji(x.wr)}</i> = ${x.wm}`
      : x.extra;

  function trainerStageHTML() {
    if (!T.cur) return `<p>${emptyMsg()}</p>`;
    const x = T.cur;
    if (T.intro) return introHTML(x);
    const pJP = T.qd === 0;
    const ptxt = pJP ? x.q : x.a;
    const prompt =
      `<div class="prompt ${pJP ? "jp " + sizeCls(ptxt) : ""}">${
        pJP ? disp(x) : x.a + (x.amb ? `<div class="small">${x.amb}</div>` : "")
      }</div>` + (pJP ? "" : scrTag(x));

    if (T.mode === "quiz" && T.qdraw && T.qfree) {
      const what =
        x.kind === "kanji"
          ? `<div class="prompt">${x.a}</div><p class="small">np. w słowie „${x.wm}” (${romaji(x.wr)})</p>`
          : `${scrTag(x)}<div class="prompt s2">${x.a}</div>${x.amb ? `<p class="small">Chodzi o ${x.amb}.</p>` : ""}`;
      if (T.answered === null) {
        return `<p class="lbl">Napisz z pamięci</p>${what}
          <div id="quiz-hand-pad" class="hand-wrap"></div>
          <div class="row">
            ${ib("data-hp-undo", "undo", "Cofnij kreskę")}
            ${ib("data-hp-clear", "clear", "Wyczyść pole")}
            <button class="btn ghost" type="button" data-giveup id="gu">Nie pamiętam</button>
            <button class="btn primary-cta" type="button" data-hp-check>Sprawdź</button>
          </div>`;
      }
      const a = T.answered;
      const verdict =
        a.state === "ok"
          ? `<span class="v ok">Dobrze</span>`
          : a.state === "ask"
          ? `<span class="v">Nie jestem pewien</span>`
          : a.state === "order"
          ? `<span class="v bad">Dobry znak, ale ${orderMsg(a.ord)}</span>`
          : `<span class="v bad">${a.giveup ? "Do powtórki" : "Inny znak"}</span>`;
      const sod = strokeOrderSVG(x.q, a.state === "order" ? 128 : 96);
      return `${what}
        <div class="hand-compare">
          ${a.img ? `<figure><img src="${a.img}" alt="Twój znak"><figcaption>twój</figcaption></figure>` : ""}
          <figure>${sod ? `<div class="model">${sod}</div>` : `<div class="jp model">${x.q}</div>`}<figcaption>kolejność kresek</figcaption></figure>
        </div>
        <div class="fb">${verdict}${a.rec && a.state !== "ok" && a.state !== "order" ? `<br>Rozpoznałem: <span class="jp" style="font-size:1.4rem">${a.rec}</span>` : ""}</div>
        ${
          a.state === "ask"
            ? `<div class="row"><button class="btn ghost" type="button" data-hp-judge="0">Nie, to inny znak</button><button class="btn primary-cta" type="button" data-hp-judge="1">Tak, to ${x.q}</button></div>`
            : `<div class="row">${a.state === "bad" && !a.giveup ? ib('data-hp-judge="1"', "check", "Uznaj — napisałem dobrze", "okb") : ""}</div>${nextBtnHTML()}`
        }`;
    }

    if (T.mode === "quiz" && T.qdraw) {
      const what =
        x.kind === "hanzi"
          ? `<div class="prompt">${x.a}</div><p class="small">pinyin: ${x.py}</p>`
          : x.kind === "kanji"
          ? `<div class="prompt">${x.a}</div><p class="small">np. w słowie „${x.wm}” (${romaji(
              x.wr
            )})</p>`
          : `${scrTag(x)}<div class="prompt s2">${x.a}</div><p class="small">${
              x.extra
            }</p>`;
      return (
        `<p class="lbl">Napisz z pamięci</p>${what}` +
        (T.answered === null
          ? `<div id="quiz-sumi-pad"></div>
             <p id="dstat" class="small">Narysuj znak kreska po kresce.</p>
             <div class="row">
               ${ib("data-qpad-undo", "undo", "Cofnij kreskę")}
               ${ib("data-qpad-clear", "clear", "Wyczyść pole")}
               <button class="btn ghost" type="button" data-giveup id="gu">Pokaż wzór</button>
             </div>`
          : `<div class="prompt jp s1">${x.q}</div>${nextBtnHTML()}`)
      );
    }

    if (T.mode === "quiz" && T.qtype) {
      return typedStage(x, pJP);

      // Pomocniczy tryb wyboru z 4 opcji

      let s =

            return `<button class="opt${
              pJP ? "" : " jp"

          x,
          "recog"

  const BK = "NIHONGO1:";
  function exportCode() {
    const o = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf("nihongo:") === 0)
          o[k.slice(8)] = localStorage.getItem(k);
      }
    } catch (e) {}
    const bytes = new TextEncoder().encode(JSON.stringify(o));
    let bin = "";
    bytes.forEach((b) => (bin += String.fromCharCode(b)));
    return BK + btoa(bin);
  }

  function importCode(raw) {
    const t = (raw || "").replace(/\s+/g, "");
    if (t.indexOf(BK) !== 0) throw new Error("format");
    const bin = atob(t.slice(BK.length));
    const bytes = Uint8Array.from(bin, (c) => c.charCodeAt(0));
    const o = JSON.parse(new TextDecoder().decode(bytes));
    if (!o || typeof o !== "object") throw new Error("format");
    const old = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf("nihongo:") === 0) old.push(k);
    }
    old.forEach((k) => localStorage.removeItem(k));
    Object.keys(o).forEach((k) =>
      localStorage.setItem("nihongo:" + k, String(o[k]))
    );
    E.mirrorAllToIDB();
  }

  function go() {
    const h = location.hash.slice(1) || "start";
    // Obsługa bezpośrednich skrótów ze starszych zakładek (#hiragana, #katakana, #kanji, #zwroty, #tematy, #gramatyka, #powtorka)
    const legacyNaukaMap = {
      hiragana: "hiragana",
      katakana: "katakana",
      kanji: "kanji",
      kuznia: "kuznia",
      zwroty: ZHC() ? "zwroty" : "zdania",
      tematy: "slownictwo",
      gramatyka: "gramatyka",
      powtorki: "powtorki",
      wymowa: "wymowa",
      znaki: "znaki",
      graf: "graf",
      budowa: "budowa",
      zd: "zd",
    };

    if (legacyNaukaMap[h]) {
      route = "nauka";
      naukaSec = legacyNaukaMap[h];
      if (h === "budowa") BZ = null;
      if (h === "zd") PS = null;
      store.set("naukaSec", naukaSec);
    } else if (h.indexOf("bz-") === 0) {
      route = "nauka";
      naukaSec = "budowa";
      bzStart(h.slice(3));
    } else if (h === "zdl" && PS) {
      route = "nauka";
      naukaSec = "zd";
    } else if (h === "zd-reka" || h === "zd-klaw") {
      route = "nauka";
      naukaSec = "zd";
      if (psPad) psPad.strokes = [];
      psStart(h.slice(3));
    } else if (h.indexOf("pisz-") === 0) {
      route = "pisanie";
      const pt = h.slice(5);
      if (["hiragana", "katakana", "kanji", "hard", "hanzi"].includes(pt)) {
        if (WStudio.poolType !== pt) WStudio.curItem = null;
        WStudio.poolType = pt;
        store.set("ws:pool", pt);
      }
      WStudio.inPool = true;
    } else if (
      ["start", "powtorka", "nauka", "pisanie", "postepy", "licencje", "sciezka", "wyzwania"].includes(h) ||
      (h === "wyzwanie" && CH)
    ) {
      route = h;
      if (h === "nauka") naukaSec = null;
      if (h === "pisanie") WStudio.inPool = false;
    } else {
      route = "start";
    }

    if (WStudio.focusMode) {
      WStudio.focusMode = false;
      document.body.classList.remove("writing-focus");
    }

    drawNav();
    closeSheet();
    view.classList.add("enter");
    clearTimeout(go.t);
    go.t = setTimeout(() => view.classList.remove("enter"), 500);
    render();
    window.scrollTo(0, 0);
    lastHash = h;
  }

   * OBSŁUGA ZDARZEŃ (Delegacja kliknięć, formularzy i IME Romaji->Kana)
   * ========================================================================== */
  // Konwersja Romaji -> Kana na żywo podczas pisania w polach z data-ime
  document.addEventListener("input", (e) => {
    const inp = e.target;
    if (!inp || !inp.dataset) return;
    if (inp.dataset.ime) {
      const converted = E.IME.romajiToKana(inp.value, inp.dataset.ime, true);
      if (converted !== inp.value) {
        const pos = inp.selectionStart;
        const diff = converted.length - inp.value.length;
        inp.value = converted;
        try {
          inp.setSelectionRange(
            Math.max(0, (pos || 0) + diff),
            Math.max(0, (pos || 0) + diff)
          );
        } catch (err) {}
      }
      return;
    }
    if (inp.dataset.brushMax !== undefined) {
      const v = Number(inp.value) || 18;
      E.savePrefs({ brushMax: v });
      if (activeSumiPad) activeSumiPad.updateOptions({ maxWidth: v });
      render();
      return;
    }
    if (inp.dataset.brushAlpha !== undefined) {
      const v = Number(inp.value) || 0.65;
      E.savePrefs({ brushAlpha: v });
      if (activeSumiPad) activeSumiPad.updateOptions({ alpha: v });
      render();
      return;
    }
  });

  document.addEventListener("click", (e) => {
    const b = e.target.closest("button,[data-close]");
    if (!b) return;
    const ds = b.dataset;

    if (ds.close !== undefined) {
      closeSheet();
      return;
    }
    if (ds.openSettings !== undefined) {
      E.FX.tap();
      importArmed = false;
      openSheet(settingsSheetHTML());
      return;
    }
    if (ds.drawFreq !== undefined) {
      E.FX.tap();
      store.set("drawFreq", +ds.drawFreq);
      if (T && !T.run) {
        T.cur = null;
        nextQ();
      }
      return;
    }
    if (ds.setMode || ds.setDir !== undefined || ds.setFlag) {
      E.FX.tap();
      if (ds.setMode) {
        store.set("mode", ds.setMode);
        if (T && !T.run) T.mode = ds.setMode;
      } else if (ds.setDir !== undefined) {
        ["kana", "kanji", "phrase", "hanzi", "mix"].forEach((k) => store.set("dir:" + k, +ds.setDir));
        if (T && !T.run) T.dir = +ds.setDir;
      } else if (ds.setFlag === "auto") {
        const v = !store.get("auto:kana", false);
        ["kana", "kanji", "phrase", "hanzi", "mix"].forEach((k) => store.set("auto:" + k, v));
      } else {
        store.set(ds.setFlag, !store.get(ds.setFlag, ds.setFlag !== "only"));
      }
      if (T && !T.run) {
        T.cur = null;
        nextQ();
        render();
      }
      return;
    }
    if (ds.prefTheme) {
      E.FX.tap();
      E.savePrefs({ theme: ds.prefTheme });
      openSheet(settingsSheetHTML());
      return;
    }
    if (ds.prefPattern) {
      E.FX.tap();
      E.savePrefs({ bgPattern: ds.prefPattern });
      if (sheet.classList.contains("open")) openSheet(settingsSheetHTML());
      else render();
      return;
    }
    if (ds.goKuznia !== undefined) {
      E.FX.tap();
      location.hash = "kuznia";
      return;
    }
    if (ds.klab) {
      E.FX.tap();
      kanjiLabMode = ds.klab;
      render();
      return;
    }
    if (ds.anatKanji) {
      E.FX.tap();
      selectedAnatomyKanji = ds.anatKanji;
      render();
      return;
    }
    if (ds.anatCustomBtn !== undefined) {
      const inp = document.getElementById("anat-custom-in");
      const ch = inp && inp.value ? inp.value.trim()[0] : "";
      if (ch) {
        selectedAnatomyKanji = ch;
        render();
      }
      return;
    }
    if (ds.buildSet) {
      E.FX.tap();
      selectedBuildSetId = ds.buildSet;
      forgeQuiz = null;
      render();
      return;
    }
    if (ds.forgePick !== undefined) {
      const idx = Number(ds.forgePick);
      const bset =
        E.KANJI_LAB.BUILD_PARTS_SETS.find((s) => s.id === selectedBuildSetId) ||
        E.KANJI_LAB.BUILD_PARTS_SETS[0];
      if (!forgeQuiz) startOrPickForgeQuiz(bset);
      if (forgeQuiz && forgeQuiz.answered === null) {
        forgeQuiz.answered = idx;
        const ok = forgeQuiz.opts[idx] === forgeQuiz.target.comp;
        forgeQuiz.total++;
        if (ok) {
          forgeQuiz.score++;
          gain(15, true);
        } else {
          E.FX.wrong();
        }
        render();
      }
      return;
    }
    if (ds.forgeNext !== undefined) {
      const bset =
        E.KANJI_LAB.BUILD_PARTS_SETS.find((s) => s.id === selectedBuildSetId) ||
        E.KANJI_LAB.BUILD_PARTS_SETS[0];
      startOrPickForgeQuiz(bset, true);
      render();
      return;
    }
    if (ds.simDue12 !== undefined) {
      E.FX.tap();
      const now = Date.now() - 60000;
      const sample = JAITEMS.slice(0, 12);
      sample.forEach((it) => {
        due[it.k] = now;
        if (!sc(it.k)) scores[it.k] = 1;
      });
      store.set("due", due);
      store.set("scores", scores);
      render();
      toast(
        "復習",
        "Symulacja > 10 powtórek!",
        "Spójrz na dolny pasek zadań — sekcja „Powtórka” miga na czerwono."
      );
      return;
    }
    if (ds.clearSimDue !== undefined) {
      E.FX.tap();
      const now = Date.now();
      Object.keys(due).forEach((k) => {
        if (due[k] <= now) delete due[k];
      });
      store.set("due", due);
      render();
      return;
    }
    if (ds.prefScale) {
      E.FX.tap();
      E.savePrefs({ fontScale: Number(ds.prefScale) || 100 });
      openSheet(settingsSheetHTML());
      return;
    }
    if (ds.prefToggle) {
      const k = ds.prefToggle;
      E.savePrefs({ [k]: k === "petals" ? E.prefs.petals === false : !E.prefs[k] });
      if (k === "petals" || k === "reducedMotion") {
        PET.list = [];
        setAmbientPetals((route === "start" || route === "postepy") && !(T && T.run));
      }
      E.FX.tap();
      openSheet(settingsSheetHTML());
      return;
    }
    if (ds.say !== undefined) {
      say(ds.say);
      return;
    }
    if (ds.strokes) {
      showStrokes(ds.strokes, ds.ch, +ds.size);
      return;
    }
    if (ds.zapis) {
      zapis = ds.zapis;
      store.set("zapis", zapis);
      render();
      return;
    }

    // Przycisk „Kontynuuj naukę” na ekranie Start
    if (ds.sessionStart !== undefined || ds.sessionExtra !== undefined) {
      E.FX.tap();
      if (ds.sessionStart !== undefined && startSession(false)) return;
      if (startSession(true)) return;
      ds.continueStudy = "";
    }
    if (ds.lesson) {
      const l = lessonById(ds.lesson);
      if (l) openSheet(lessonSheetHTML(l, pathState().st[l.id]));
      return;
    }
    if (ds.lessonGo) {
      const l = lessonById(ds.lessonGo);
      if (l) startLesson(l, ds.mode);
      return;
    }
    if (ds.lang) {
      if (ds.lang !== window.GLOSA_LANG && window.I18N) window.I18N.setLang(ds.lang);
      return;
    }
    if (ds.plans !== undefined) {
      openSheet(plansHTML());
      return;
    }
    if (ds.plan) {
      store.set("plan", ds.plan);
      E.FX.tap();
      openSheet(plansHTML());
      render();
      return;
    }
    if (ds.continueStudy !== undefined) {
      E.FX.tap();
      const nd = dueItems().length;
      if (nd > 0) {
        startReview();
      } else {
        const nextStep = getNextRecommendedCurriculumStep();
        naukaSec = nextStep.sec;
        store.set("naukaSec", naukaSec);
        const deckKey =
          naukaSec === "slownictwo"
            ? "tematy"
            : naukaSec === "zdania"
            ? "zwroty"
            : naukaSec;
        const d = deckOf(deckKey);
        openTrainer(d, { run: true, mode: "quiz" });
        redraw();
      }
      return;
    }

    if (ds.goTab) {
      location.hash = ds.goTab;
      return;
    }
    if (ds.goAudio !== undefined) {
      subMode.zdania = "i1";
      location.hash = "zwroty";
      return;
    }
    if (ds.startAudioQuiz !== undefined) {
      openTrainer(DECKS.zwroty, {
        run: true,
        mode: "quiz",
        audioOnly: true,
      });
      redraw();
      return;
    }
    if (ds.startDeck) {
      const d = deckOf(ds.startDeck);
      openTrainer(d, { run: true, mode: "quiz" });
      redraw();
      return;
    }
    if (ds.goWriteDeck) {
      if (["hiragana", "katakana", "kanji"].includes(ds.goWriteDeck)) {
        WStudio.poolType = ds.goWriteDeck;
        store.set("ws:pool", WStudio.poolType);
        WStudio.curItem = null;
      }
      location.hash = ZHC() ? "pisz-hanzi" : "pisz-" + WStudio.poolType;
      return;
    }
    if (bzClick(ds)) return;
    if (psClick(ds)) return;
    if (chClick(ds)) return;
    if (ds.back) {
      E.FX.tap();
      if (window.__cameFromMenu && history.length > 1) history.back();
      else location.hash = ds.back;
      return;
    }

    // Zakładki wewnątrz Nauki
    if (ds.nsec) {
      E.FX.tap();
      location.hash = naukaHash(ds.nsec);
      return;
    }
    if (ds.sub) {
      E.FX.tap();
      subMode[naukaSec] = ds.sub;
      render();
      return;
    }
    if (ds.zdmode) {
      subMode.zdania = ds.zdmode;
      render();
      return;
    }
    if (ds.rad) {
      selectedRadicalId = ds.rad;
      render();
      return;
    }
    if (ds.jumpRad) {
      selectedRadicalId = ds.jumpRad;
      closeSheet();
      navTo("graf");
      return;
    }
    if (ds.grade) {
      kGrade = +ds.grade;
      store.set("grade", kGrade);
      T = null;
      WStudio.curItem = null;
      render();
      return;
    }

    // Otwieranie kart znaków
    if (ds.openItem) {
      const it = ALL_BY_KEY[ds.openItem];
      if (!it) return;
      if (it.kind === "kanji") openSheet(sheetHTML(it));
      else if (it.kind === "hanzi") openSheet(hanziSheet(it));
      else if (it.kind === "kana")
        openSheet(kanaSheetHTML(it.kata ? DECKS.katakana : DECKS.hiragana, it));
      return;
    }
    if (ds.kanji) {
      openSheet(sheetHTML(KMAP[ds.kanji.slice(6)]));
      return;
    }
    if (ds.hanzi) {
      openSheet(hanziSheet(ZHD.map[ds.hanzi]));
      return;
    }
    if (ds.cell) {
      const d = deckOf(naukaSec);
      openSheet(kanaSheetHTML(d, d.byKey[ds.cell] || ALL_BY_KEY[ds.cell]));
      return;
    }
    if (ds.drawthis) {
      const it = ALL_BY_KEY[ds.drawthis];
      closeSheet();
      if (it) {
        WStudio.curItem = it;
        const pt = it.kind === "hanzi" ? "hanzi" : it.kind === "kanji" ? "kanji" : it.kata ? "katakana" : "hiragana";
        if (it.kind === "kanji") kGrade = it.grade;
        WStudio.poolType = pt;
        if (route === "pisanie" && WStudio.inPool) render();
        else navTo("pisz-" + pt);
      }
      return;
    }

    // Shadowing (nagrywanie głosu)
    if (ds.shadow) {
      const phrase = ds.shadow;
      const stEl = document.getElementById("shadow-status");
      E.Shadowing.toggle((state) => {
        if (state.error) {
          if (stEl) stEl.textContent = state.error;
        } else if (state.recording) {
          b.textContent = "⏹ Stop";
          if (stEl) stEl.textContent = "Nagrywanie… Powiedz teraz głośno: " + phrase;
        } else if (state.url) {
          b.textContent = "🎙 Nagraj";
          if (stEl)
            stEl.innerHTML = `Nagranie gotowe: <button class="say" type="button" data-play-shadow>▶ Odtwórz mój głos</button> i porównaj z wzorcem ${sayBtn(
              phrase,
              "Wzorzec"
            )}`;
        }
      });
      return;
    }
    if (ds.playShadow !== undefined) {
      E.Shadowing.playRecorded();
      return;
    }

    // Kontrolki zakładki Pisanie (Sumi Studio)
    if (ds.wpool) {
      WStudio.poolType = ds.wpool;
      store.set("ws:pool", WStudio.poolType);
      pickNextWritingItem();
      render();
      return;
    }
    if (ds.wlevel) {
      WStudio.level = Number(ds.wlevel) || 1;
      store.set("ws:level", WStudio.level);
      render();
      return;
    }
    if (ds.wtool) {
      WStudio.tool = ds.wtool;
      E.savePrefs({ brushTool: WStudio.tool });
      if (activeSumiPad) activeSumiPad.updateOptions({ tool: WStudio.tool });
      render();
      return;
    }
    if (ds.wgrid) {
      E.savePrefs({ gridMode: ds.wgrid });
      if (activeSumiPad) activeSumiPad.updateOptions({ grid: ds.wgrid });
      render();
      return;
    }
    if (ds.toggleWsettings !== undefined) {
      WStudio.showControls = !WStudio.showControls;
      render();
      return;
    }
    if (ds.toggleWfocus !== undefined) {
      WStudio.focusMode = !WStudio.focusMode;
      document.body.classList.toggle("writing-focus", WStudio.focusMode);
      render();
      return;
    }
    if (ds.sumiAct) {
      const act = ds.sumiAct;
      const statEl = document.getElementById("sumi-status");
      const selfEl = document.getElementById("sumi-self-eval");
      if (act === "undo" && activeSumiPad) activeSumiPad.undo();
      else if (act === "redo" && activeSumiPad) activeSumiPad.redo();
      else if (act === "clear" && activeSumiPad) {
        activeSumiPad.clear();
        if (statEl) statEl.textContent = "Płótno wyczyszczone.";
      } else if (act === "replay" && activeSumiPad) {
        activeSumiPad.replayUserStrokes();
      } else if (act === "anim" && activeSumiPad) {
        activeSumiPad.animateModel();
      } else if (act === "check" && activeSumiPad && WStudio.curItem) {
        const res = activeSumiPad.evaluateWholeCharacter();
        if (statEl) statEl.textContent = res.message;
        if (selfEl) selfEl.hidden = false;
        if (res.supported) {
          markW(WStudio.curItem.k, res.ok, res.ok ? 3 : 1);
          if (res.ok) {
            G.drawn++;
            E.FX.ok();
          } else {
            E.FX.bad();
          }
          gain(res.ok ? 20 : 5, res.ok);
        }
      } else if (act === "next") {
        pickNextWritingItem();
        render();
      }
      return;
    }
    if (ds.sumiSelf !== undefined && WStudio.curItem) {
      const ok = ds.sumiSelf === "1";
      markW(WStudio.curItem.k, ok, ok ? 3 : 1);
      if (ok) G.drawn++;
      gain(ok ? 15 : 0, ok);
      pickNextWritingItem();
      render();
      return;
    }

    // Confusion Battle
    if (ds.startBattle) {
      startConfusionBattle(ds.startBattle);
      return;
    }
    if (ds.battleClose !== undefined) {
      battle = null;
      setFocus(false, "");
      render();
      return;
    }
    if (ds.battleNext !== undefined && battle) {
      battle.step++;
      battle.feedback = "";
      renderBattle();
      return;
    }
    if (ds.battlePadClear !== undefined && activeSumiPad) {
      activeSumiPad.clear();
      return;
    }
    if (ds.battlePick && battle) {
      const picked = ALL_BY_KEY[ds.battlePick];
      if (picked && picked === battle.finalTarget) {
        E.FX.ok();
        E.CONFUSION.markPairResolved(battle.pair.id);
        mark(battle.a.k, true, "recog", 3);
        mark(battle.b.k, true, "recog", 3);
        gain(25, true);
        battle = null;
        setFocus(false, "");
        toast("勝", "Trening ukończony", "Ta para już ci się nie myli.");
        render();
      } else {
        E.FX.bad();
        battle.feedback = "To drugi znak z pary! Spójrz uważnie na kształt i spróbuj ponownie.";
        renderBattle();
      }
      return;
    }

    // Zmiana kursu i eksport/import
    if (ds.course) {
      COURSE = ds.course === "zh" ? "zh" : "ja";
      store.set("course", COURSE);
      document.body.classList.toggle("zh", ZHC());
      naukaSec = null;
      WStudio.inPool = false;
      WStudio.poolType = ZHC() ? "hanzi" : "hiragana";
      WStudio.curItem = null;
      T = null;
      closeSheet();
      hud();
      render();
      return;
    }
    if (ds.review !== undefined) {
      startReview();
      return;
    }
    if (ds.export !== undefined) {
      let code;
      try {
        code = exportCode();
      } catch (err) {
        setMsg("bmsg", "Nie udało się odczytać postępu.", true);
        return;
      }
      const ta = document.getElementById("bcode");
      if (ta) {
        ta.value = code;
        ta.hidden = false;
      }
      const done = () =>
        setMsg("bmsg", "Skopiowane do schowka. Zachowaj ten kod jako kopię zapasową.");
      const fallback = () => {
        if (ta) {
          ta.focus();
          ta.select();
        }
        setMsg("bmsg", "Kod został zaznaczony w polu powyżej — skopiuj go ręcznie.");
      };
      try {
        navigator.clipboard.writeText(code).then(done, fallback);
      } catch (err) {
        fallback();
      }
      return;
    }
    if (ds.import !== undefined) {
      const v = (document.getElementById("bin") || {}).value || "";
      if (!v.trim()) {
        setMsg("imsg", "Najpierw wklej kod postępu.", true);
        return;
      }
      if (!importArmed) {
        importArmed = true;
        b.textContent = "Potwierdź zastąpienie postępu";
        setMsg(
          "imsg",
          "Kliknij ponownie, aby zastąpić obecne dane wczytaną kopią.",
          true
        );
        return;
      }
      try {
        importCode(v);
        setMsg("imsg", "Wczytano pomyślnie. Odświeżam…");
        setTimeout(() => location.reload(), 500);
      } catch (err) {
        importArmed = false;
        b.textContent = "Wczytaj postęp";
        setMsg("imsg", "Nieprawidłowy format kodu.", true);
      }
      return;
    }

    // Zdarzenia wewnątrz Trenera (T)
    if (!T) return;
    if (
      (ds.giveup !== undefined ||
        ds.skip !== undefined ||
        ds.opt !== undefined ||
        ds.reveal !== undefined) &&
      Date.now() - (T.at || 0) < 350
    )
      return;

    if (ds.grp) {
      if (ds.grp === "*all") T.sel = new Set(T.deck.groups.map((g) => g.id));
      else if (ds.grp === "*none") T.sel = new Set();
      else T.sel.has(ds.grp) ? T.sel.delete(ds.grp) : T.sel.add(ds.grp);
      store.set("sel:" + T.deck.id, [...T.sel]);
      T.cur = null;
      nextQ();
    } else if (ds.mode) {
      T.mode = ds.mode;
      store.set("mode", T.mode);
      nextQ();
    } else if (ds.dir) {
      T.dir = +ds.dir;
      store.set("dir:" + T.deck.kind, T.dir);
      nextQ();
    } else if (ds.typing !== undefined) {
      store.set("typing", !typingOn());
      nextQ();
    } else if (ds.qdraw !== undefined) {
      store.set("qdraw", !drawOn());
      nextQ();
    } else if (ds.only !== undefined) {
      store.set("only", ds.only === "1");
      T.cur = null;
      nextQ();
    } else if (ds.start !== undefined) {
      T.run = true;
      T.ok = 0;
      T.n = 0;
      nextQ();
    } else if (ds.stop !== undefined) {
      settle();
      T.run = false;
      clearTimeout(T.timer);
    } else if (ds.hpUndo !== undefined && handPad) {
      handPad.undo();
      return;
    } else if (ds.hpClear !== undefined && handPad) {
      handPad.clear();
      return;
    } else if (ds.hpCheck !== undefined && handPad) {
      if (handPad.isEmpty() || T.answered !== null) return;
      const x = T.cur;
      const r = window.HandRecog.recognize(handPad.snapshot(), handPad.size, {});
      const top = r.candidates[0];
      const same = (c) => c && (window.HandRecog.isLookalike(c, x.q) || window.HandRecog.sizePair(c, x.q));
      const hit = r.candidates.find((c) => same(c.ch));
      const gap = hit && top ? hit.score - top.score : 1;
      let state = top && same(top.ch) ? (r.confidence >= 0.25 ? "ok" : "ask") : gap <= 0.03 ? "ok" : gap <= 0.07 ? "ask" : "bad";
      const ord = window.HandRecog.checkOrder ? window.HandRecog.checkOrder(handPad.snapshot(), x.q) : null;
      if (state === "ok" && ord && !ord.ok) state = "order";
      T.answered = { draw: true, state, ord, rec: top ? top.ch : "", img: handPad.thumbnail(96), conf: r.confidence };
      if (!(window.STROKES && window.STROKES[x.q])) getStrokeDataForChar(x.q).then(() => T && T.cur === x && redraw());
      if (state !== "ask") finishHand(state === "ok", r.confidence >= 0.7 ? 4 : 3);
    } else if (ds.hpJudge !== undefined) {
      if (!T.answered || !T.answered.draw) return;
      const wasBad = T.answered.state === "bad";
      T.answered.state = ds.hpJudge === "1" ? "ok" : "bad";
      if (!wasBad && T.answered.state === "ok" && T.answered.ord && !T.answered.ord.ok) T.answered.state = "order";
      if (wasBad) {
        // poprawka po wcześniej zapisanym błędzie
        markW(T.cur.k, true, 2);
        T.ok++;
      } else finishHand(T.answered.state === "ok", 3);
    } else if (ds.qpadUndo !== undefined && activeSumiPad) {
      activeSumiPad.undo();
      return;
    } else if (ds.qpadClear !== undefined && activeSumiPad) {
      activeSumiPad.clear();
      return;
    } else if (ds.giveup !== undefined) {
      if (T.answered !== null) return;
      T.answered = T.qfree ? { draw: true, state: "bad", giveup: true, img: handPad && !handPad.isEmpty() ? handPad.thumbnail(96) : "" } : "draw";
      E.FX.bad();
      E.CONFUSION.recordError(T.cur, null, "write", JAITEMS);
      markW(T.cur.k, false, 1);
      T.n++;
      gain(0, false);
    } else if (ds.skip !== undefined) {
      if (T.answered !== null) return;
      T.answered = { ok: false, val: "" };
      E.FX.bad();
      E.CONFUSION.recordError(T.cur, "", "recog", JAITEMS);
      mark(T.cur.k, false, "recog", 1);
      T.n++;
      gain(0, false);
    } else if (ds.override !== undefined) {
      if (!T.pend) return;
      T.pend = false;
      T.answered.ok = true;
      E.FX.ok();
      mark(T.cur.k, true, T.qd === 0 ? "read" : "recog", 2);
      T.n++;
      T.ok++;
      gain(15, true);
    } else if (ds.opt !== undefined) {
      if (T.answered !== null) return;
      T.answered = +ds.opt;
      const picked = T.opts[T.answered];
      const ok = picked === T.cur;
      if (ok) {
        E.FX.ok();
        mark(T.cur.k, true, "recog", 3);
        T.n++;
        T.ok++;
        gain(10, true);
      } else {
        E.FX.bad();
        E.CONFUSION.recordError(T.cur, picked, "recog", JAITEMS);
        mark(T.cur.k, false, "recog", 1);
        T.n++;
        gain(0, false);
      }
    } else if (ds.reveal !== undefined) {
      T.revealed = true;
    } else if (ds.fsrsRate) {
      const g = Number(ds.fsrsRate) || 3;
      const sk = T.qdraw
        ? "write"
        : T.audioOnly
        ? "audio"
        : T.qd === 0
        ? "read"
        : "recog";
      if (T.pend) {
        T.pend = false;
        const ok = g >= 2;
        if (!ok) {
          E.CONFUSION.recordError(
            T.cur,
            T.answered ? T.answered.val : "",
            sk,
            JAITEMS
          );
        }
        mark(T.cur.k, ok, sk, g);
        T.n++;
        if (ok) T.ok++;
        gain(ok ? 15 : 0, ok);
      } else if (T.mode === "cards") {
        const ok = g >= 2;
        mark(T.cur.k, ok, "meaning", g);
        T.n++;
        if (ok) T.ok++;
        gain(ok ? 8 : 0, ok);
      } else if (T.cur) {
        // Aktualizacja interwału zgodnie z wybraną oceną FSRS (1..4)
        const card = E.FSRS.recordReview(T.cur.k, sk, g);
        setDue(T.cur.k, g >= 2, g >= 2 ? card.due : 0);
      }
      nextQ();
    } else if (ds.next !== undefined) {
      settle();
      nextQ();
    } else {
      return;
    }
    redraw();
  });

  document.addEventListener("submit", (e) => {
    e.preventDefault();
    if (e.target && e.target.hasAttribute && e.target.hasAttribute("data-ps-form") && PS) {
      const v = (document.getElementById("ps-ans") || {}).value || "";
      PS.typed = v;
      if (!v.trim()) return;
      if (/[a-ząćęłńóśźż]/i.test(v)) {
        PS.msg = "Pisz japońską klawiaturą, nie literami.";
        render();
        const i = document.getElementById("ps-ans");
        if (i) i.focus();
        return;
      }
      psFinish(false);
      render();
      return;
    }
    if (e.target && e.target.id === "battle-form" && battle) {
      const inp = document.getElementById("battle-inp");
      if (!inp) return;
      const val = normA(inp.value);
      const target = battle.quizTarget;
      const ok =
        romaOK(target.a.toLowerCase(), val) ||
        normA(target.a).includes(val) ||
        (target.wr && toHira(E.IME.romajiToKana(val, "hiragana", false)) === target.wr);
      if (ok && val.length > 0) {
        E.FX.ok();
        battle.step = 4;
        battle.feedback = "";
      } else {
        E.FX.bad();
        battle.feedback = `Ten znak to „${target.a}” (${target.q}). Wpisz „${target.a}”, aby przejść dalej.`;
      }
      renderBattle();
      return;
    }

    if (!T || !T.cur || !T.qtype || T.answered !== null) return;
    const inp = document.getElementById("ans");
    if (!inp) return;
    const r = checkTyped(T.cur, T.qd, inp.value);
    if (typeof r === "object") {
      const m = document.getElementById("amsg");
      if (m) m.textContent = r.retry;
      inp.focus();
      return;
    }
    const ok = r === "ok";
    T.answered = { ok, val: inp.value };
    const sk = T.audioOnly ? "audio" : T.qd === 0 ? "read" : "recog";
    if (ok) {
      E.FX.ok();
      mark(T.cur.k, true, sk, Date.now() - (T.at || 0) < 6000 ? 4 : 3);
      T.n++;
      T.ok++;
      gain(15, true);
    } else {
      E.FX.bad();
      T.pend = true;
    }
    redraw();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (document.body.classList.contains("open")) closeSheet();
    else if (battle) {
      battle = null;
      setFocus(false, "");
      render();
    } else if (T && T.run) {
      settle();
      T.run = false;
      clearTimeout(T.timer);
      redraw();
    }
  });

  let settingsScroll = 0;
  document.addEventListener("click", (e) => { settingsScroll = sheet.scrollTop; }, true);
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-settings] button");
    if (!b || b.dataset.close !== undefined || b.dataset.export !== undefined || b.dataset.import !== undefined || b.dataset.course) return;
    const y = settingsScroll;
    setTimeout(() => {
      if (!document.querySelector("[data-settings]")) return;
      sheet.innerHTML = settingsSheetHTML();
      sheet.scrollTop = y;
    }, 0);
  });
  drawScenery();
  window.addEventListener("hashchange", () => {
    const h = location.hash.slice(1);
    window.__cameFromMenu = ["nauka", "pisanie", "budowa", "zd", "sciezka", "wyzwania"].includes(lastHash) && h !== lastHash;
  }, true);
  window.addEventListener("hashchange", go);
  if (checkBadges()) store.set("game", G);
  hud();
  go();
})();
</script>

<script>
(function(){
  if(!("serviceWorker" in navigator))return;
  var asked=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){if(asked)location.reload()});
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      function show(){var b=document.getElementById("upd");b.classList.add("show");
        document.getElementById("updbtn").onclick=function(){asked=true;if(reg.waiting)reg.waiting.postMessage("skip");else location.reload()}}
      if(reg.waiting&&navigator.serviceWorker.controller)show();
      reg.addEventListener("updatefound",function(){var w=reg.installing;if(!w)return;
        w.addEventListener("statechange",function(){if(w.state==="installed"&&navigator.serviceWorker.controller)show()})});
      setInterval(function(){reg.update().catch(function(){})},30*60*1000);
      document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")reg.update().catch(function(){})});
    }).catch(function(){});
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
  });
})();
</script>
